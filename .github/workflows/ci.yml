name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install numpy==1.26.4 pytest==8.3.3 ruff==0.17.4
      - name: Lint
        run: ruff check . && ruff format --check verifier scripts/verifier tests
      - name: Test
        run: pytest -q
